name: Live E2E smoke

on:
  push:
    branches:
      - ops/live-e2e-check-20261006

jobs:
  live-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check standalone relay and phone node
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in {1..12}; do
            body="$(curl -fsS --max-time 15 https://bhai-relay.onrender.com/health)" && {
              echo "$body"
              node - "$body" <<'NODE'
          const d = JSON.parse(process.argv[2]);
          if (!(d.ok === true && d.configured === true && d.connected === true)) {
            process.exit(1);
          }
          NODE
              ok=1
              break
            }
            sleep 5
          done
          test "$ok" = 1

      - name: Check Core -> relay -> phone -> model
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS --max-time 90 https://bhai-core.onrender.com/v1/engine/health)"
          echo "$body"
          node - "$body" <<'NODE'
          const d = JSON.parse(process.argv[2]);
          if (!(d.provider === "engine" &&
                d.configured === true &&
                d.ok === true &&
                d.reachable === true &&
                d.model_available === true)) {
            process.exit(1);
          }
          NODE

      - name: Final verdict
        run: echo "BHAI LIVE E2E GREEN: relay connected + core reached phone + model available"
