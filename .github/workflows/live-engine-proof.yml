name: Live Mobile Engine Proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-engine-proof.yml"
      - "src/engine.js"
      - "src/mobileNode.js"
      - "engine/**"
      - "docs/production-engine-verification-2026-10-08.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for deployed Core and prove live inference
        shell: bash
        run: |
          set -euo pipefail
          url="https://bhai-core.onrender.com/v1/engine/health?inference=true"

          for attempt in $(seq 1 24); do
            echo "Live inference proof attempt $attempt/24"
            body="$(curl --fail --silent --show-error --max-time 25 "$url" || true)"
            echo "$body"

            if echo "$body" | jq -e '
              .ok == true
              and .inference == true
              and .model == "smollm2.gguf"
              and .target_role == "primary"
              and .fallback_used == false
              and (.text | type == "string")
              and (.text | length > 0)
            ' >/dev/null 2>&1; then
              echo "LIVE ENGINE PROOF: PASS"
              exit 0
            fi

            sleep 5
          done

          echo "LIVE ENGINE PROOF: FAIL"
          exit 1
