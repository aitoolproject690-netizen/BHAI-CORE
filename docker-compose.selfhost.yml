services:
  bhai-core:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "10000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 10000
      BHAI_STORE_BACKEND: json
      BHAI_STORE_FILE: /data/bhai-core-store.json
      BHAI_ENGINE_URL: ${BHAI_ENGINE_URL:-mobile://local}
      BHAI_ENGINE_MODEL: ${BHAI_ENGINE_MODEL:-smollm2.gguf}
      BHAI_MOBILE_NODE_TOKEN: ${BHAI_MOBILE_NODE_TOKEN:?Set BHAI_MOBILE_NODE_TOKEN in the environment}
      BHAI_CORE_BOOTSTRAP_API_KEY: ${BHAI_CORE_BOOTSTRAP_API_KEY:?Set BHAI_CORE_BOOTSTRAP_API_KEY in the environment}
      BHAI_CORE_USERNAME: ${BHAI_CORE_USERNAME:?Set BHAI_CORE_USERNAME in the environment}
      BHAI_CORE_PASSWORD: ${BHAI_CORE_PASSWORD:?Set BHAI_CORE_PASSWORD in the environment}
    volumes:
      - bhai-core-data:/data
    networks:
      - bhai-public
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:10000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  bhai-core-data:

networks:
  bhai-public:
    name: bhai-public
