name: BHAI-CORE CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bhai
          POSTGRES_PASSWORD: bhai
          POSTGRES_DB: bhaicore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bhai -d bhaicore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: PostgreSQL integration test
        env:
          DATABASE_URL: postgres://bhai:bhai@127.0.0.1:5432/bhaicore
          BHAI_STORE_BACKEND: postgres
          BHAI_STORE_PG_TABLE: bhai_core_ci_store
          BHAI_STORE_PG_SSL: "false"
        run: node --test test/postgresStore.integration.test.js

