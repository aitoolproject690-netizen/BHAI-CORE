name: BHAI-CORE CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bhai
          POSTGRES_PASSWORD: bhai
          POSTGRES_DB: bhaicore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bhai -d bhaicore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: PostgreSQL integration test
        env:
          DATABASE_URL: postgres://bhai:bhai@127.0.0.1:5432/bhaicore
          BHAI_STORE_BACKEND: postgres
          BHAI_STORE_PG_TABLE: bhai_core_ci_store
          BHAI_STORE_PG_SSL: "false"
        run: node --test test/postgresStore.integration.test.js

      - name: Validate self-hosted Compose files
        run: |
          docker compose -f docker-compose.selfhost.yml config -q
          docker compose -f docker-compose.public.yml config -q
      - name: Build self-hosted Docker image
        run: docker build --tag bhai-core-ci .
      - name: Smoke-test self-hosted container
        run: |
          set -e
          docker run --detach --name bhai-core-ci-run \
            -e HOST=0.0.0.0 \
            -e PORT=10000 \
            -e BHAI_STORE_BACKEND=json \
            -e BHAI_STORE_FILE=/tmp/bhai-core-store.json \
            -p 10000:10000 \
            bhai-core-ci
          trap 'docker rm -f bhai-core-ci-run >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:10000/health >/tmp/bhai-core-health.json; then
              node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync("/tmp/bhai-core-health.json","utf8")); if(d.ok!==true) process.exit(1); console.log(JSON.stringify({ok:d.ok,service:d.service,storage:d.storage?.backend}));'
              exit 0
            fi
            sleep 1
          done
          docker logs bhai-core-ci-run
          exit 1

# CI trigger verification
